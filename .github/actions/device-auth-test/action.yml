name: 'GitHub Device Auth Test'
description: >-
  Runs scripts/test-device-auth.sh's 'auth' command against the
  github-device-auth Cloud Run service, so other workflows/actions in this
  repo (or in repos that reference this action directly) can reuse it
  without reimplementing the curl/gcloud calls. With no refresh-token
  input, starts a new device flow; with one, exchanges it for a new
  access/refresh token instead.

  The runner must already be authenticated to gcloud with access to
  describe the Cloud Run service and mint identity tokens for it (for
  example via google-github-actions/auth run before this action).
inputs:
  project-id:
    description: 'GCP project ID. Defaults to the active gcloud config project.'
    required: false
    default: ''
  service-name:
    description: 'Cloud Run service name.'
    required: false
    default: 'github-device-auth-router'
  region:
    description: 'GCP region the Cloud Run service is deployed in.'
    required: false
    default: 'us-central1'
  refresh-token:
    description: >-
      Refresh token to exchange. If set (or if the GITHUB_REFRESH_TOKEN
      environment variable is already set on the job), runs the refresh
      flow instead of starting a new device flow.
    required: false
    default: ''
  impersonate-service-account:
    description: >-
      Service account email to pass as --impersonate-service-account on
      every `gcloud auth print-identity-token` call. Required when the
      runner authenticated via Workload Identity Federation (gcloud
      rejects the --audiences flag outright on that credential type
      without it, even though `gcloud auth list` already shows the
      impersonated service account as active) - leave empty for a plain
      service-account-keyed login, which doesn't need it.
    required: false
    default: ''
  non-interactive:
    description: >-
      Skip the "press enter to continue" prompt during the device flow and
      start polling immediately. Set to 'false' only for a manually
      attended run; unattended CI runs should leave this 'true'.
    required: false
    default: 'true'
  show-tokens:
    description: >-
      Print raw token values to the step's stdout instead of just
      "yes"/"no". Step outputs are masked either way; this only affects
      the log. Leave 'false' unless you specifically need it for debugging.
    required: false
    default: 'false'
outputs:
  access-token:
    description: 'The GitHub access token returned by the flow.'
    value: ${{ steps.run.outputs.access-token }}
  refresh-token:
    description: 'The GitHub refresh token returned by the flow (rotated on every refresh).'
    value: ${{ steps.run.outputs.refresh-token }}
runs:
  using: 'composite'
  steps:
    - name: Run device-auth test script
      id: run
      shell: bash
      env:
        GITHUB_REFRESH_TOKEN: ${{ inputs.refresh-token }}
        IDENTITY_TOKEN_IMPERSONATE_SERVICE_ACCOUNT: ${{ inputs.impersonate-service-account }}
      run: |
        set -euo pipefail

        args=(
          auth
          --service-name "${{ inputs.service-name }}"
          --region "${{ inputs.region }}"
        )

        if [[ -n "${{ inputs.project-id }}" ]]; then
          args+=(--project-id "${{ inputs.project-id }}")
        fi

        if [[ -n "${{ inputs.impersonate-service-account }}" ]]; then
          args+=(--impersonate-service-account "${{ inputs.impersonate-service-account }}")
        fi

        if [[ "${{ inputs.non-interactive }}" == "true" ]]; then
          args+=(--non-interactive)
        fi

        if [[ "${{ inputs.show-tokens }}" == "true" ]]; then
          args+=(--show-tokens)
        fi

        "${{ github.action_path }}/../../../scripts/test-device-auth.sh" "${args[@]}"
